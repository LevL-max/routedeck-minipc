# router-wan: bind Xray's physical outbounds to the selected WAN (Ethernet or 4G) before start.
# Same ExecStartPre sequence as Mini-PC 1, whose xray.service carries it inline.
[Service]
ExecStartPre=
ExecStartPre=+/usr/local/sbin/router-wan bind-xray
ExecStartPre=+/usr/bin/python3 /usr/local/lib/router-xray/prepare_config.py
ExecStartPre=/usr/local/bin/xray run -test -config /etc/xray/config.json
